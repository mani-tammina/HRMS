<ion-grid class="create-offer-header">
  <ion-row class="header-row">

    <!-- Title -->
    <ion-col size="2" class="title-section">
      <h2>Create Offer</h2>
      <p>Offer Management</p>
    </ion-col>

    <!-- Stepper -->
    <ion-col size="8">

      <div class="stepper">

        <button class="step-btn" (click)="navigate('CreateOffer')" [class.active]="activeTab === 'CreateOffer'">

          <span class="circle">1</span>

          <div class="step-text">
            <span class="step-title">Job Details</span>
            <small>Basic Information</small>
          </div>

        </button>

        <div class="line"></div>

        <button class="step-btn" (click)="navigate('salaryStaructure')"
          [class.active]="activeTab === 'salaryStaructure'">

          <span class="circle">2</span>

          <div class="step-text">
            <span class="step-title">Compensation</span>
            <small>Salary Structure</small>
          </div>

        </button>

        <div class="line"></div>

        <button class="step-btn" (click)="navigate('OfferDetailsComponent')"
          [class.active]="activeTab === 'OfferDetailsComponent'">

          <span class="circle">3</span>

          <div class="step-text">
            <span class="step-title">Offer Details</span>
            <small>Terms & Conditions</small>
          </div>

        </button>

        <div class="line"></div>

        <button class="step-btn" (click)="navigate('preview_send')" [class.active]="activeTab === 'preview_send'">

          <span class="circle">4</span>

          <div class="step-text">
            <span class="step-title">Preview</span>
            <small>Review & Send</small>
          </div>

        </button>

      </div>

    </ion-col>

    <!-- Buttons -->

    <ion-col size="2">

      <div class="button-container">

        <ion-button class="continue-btn" (click)="onContinue()">

          Continue

        </ion-button>

        <ion-button class="offer-btn" (click)="onCreateOfferemail()" [disabled]="isSending">

          <ion-spinner *ngIf="isSending" name="crescent" slot="start" style="width:16px;height:16px;margin-right:6px;"></ion-spinner>
          {{ isSending ? 'Sending...' : 'Create Offer' }}

        </ion-button>

      </div>

    </ion-col>

  </ion-row>
</ion-grid>
